name: Публикация на PyPI

# Новая версия уходит на PyPI, когда в репозиторий пушится тег vX.Y.Z[.n]:
#   git tag v1.26.10.1 && git push origin v1.26.10.1
# Тег должен совпадать с версией в pyproject.toml и zipfinam/__init__.py.
# Ручной запуск (Actions -> Публикация на PyPI -> Run workflow) только собирает и тестирует.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Тег совпадает с версией пакета
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' zipfinam/__init__.py)
          echo "тег: $tag, pyproject.toml: $project, zipfinam/__init__.py: $module"
          if [ "$tag" != "$project" ] || [ "$tag" != "$module" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией пакета (pyproject.toml: $project, zipfinam/__init__.py: $module)"
            exit 1
          fi
      - name: Собрать wheel и sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Тесты на собранном wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Установить wheel со всеми extras
        run: python -m pip install "$(ls dist/*.whl)[dev]"
      - name: Прогнать тесты
        # tests/ и examples/ (тесты гоняют стратегии оттуда) копируются в отдельную папку,
        # иначе zipfinam импортируется из исходников, а не из wheel
        run: |
          mkdir "$RUNNER_TEMP/suite"
          cp -r tests examples "$RUNNER_TEMP/suite/"
          cd "$RUNNER_TEMP/suite"
          python -m pytest tests -q -p no:cacheprovider

  publish:
    name: Публикация на PyPI
    if: github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zipfinam/
    permissions:
      id-token: write  # Trusted Publishing: PyPI выдаёт токен на один запуск
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Пустой секрет = Trusted Publishing. Если он не настроен на PyPI,
          # положите API-токен в секрет PYPI_API_TOKEN окружения pypi.
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Релиз на GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Создать релиз и приложить сборку
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "zipFinam ${GITHUB_REF_NAME#v}"
          fi
